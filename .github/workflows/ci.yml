name: Saath CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Backend Tests & Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run verification & agent pipeline tests
        env:
          PYTHONPATH: .
        run: |
          cd backend
          python -m pytest tests/test_agent_pipeline.py -v

      - name: Run 35-item evaluation suite
        env:
          PYTHONPATH: .
        run: |
          cd backend
          python tests/run_eval.py
