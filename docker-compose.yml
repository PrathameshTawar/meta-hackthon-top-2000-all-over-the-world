version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/saath.db
      CHECKPOINTS_DB_PATH: /data/checkpoints.db
    volumes:
      - saath_data:/data

volumes:
  saath_data:
